# Generated by scripts/render-compose.ts from infra/versions.json. No secrets.
name: bpc-v00
x-app: &app
  image: bpc-console:0.1.0
  user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
  build:
    context: ../..
    dockerfile: infra/compose/Dockerfile
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 512m
  cpus: 1.0
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_USER: console_owner
      POSTGRES_DB: console
      POSTGRES_PASSWORD_FILE: /run/lab-secrets/password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql
      - postgres_files:/docker-entrypoint-initdb.d:ro
      - postgres_files:/run/lab-secrets:ro
    depends_on: { volume-init: { condition: service_completed_successfully } }
    networks: [database]
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U console_owner -d console"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    command: [node, --import, tsx, scripts/migrate.ts]
    environment: { DATABASE_URL_FILE: /run/secrets/owner_url }
    secrets: [owner_url]
    networks: [database]
    depends_on: { postgres: { condition: service_healthy } }
  seed:
    <<: *app
    command: [node, --import, tsx, scripts/seed-lab.ts]
    environment: { DATABASE_URL_FILE: /run/secrets/owner_url, RPC_SOURCES_FILE: /lab/rpc-sources.json }
    secrets: [owner_url]
    volumes:
      - ../../.runtime/lab/public.json:/lab/public.json:ro
      - ./rpc-sources.json:/lab/rpc-sources.json:ro
    networks: [database, chain]
    depends_on: { migrate: { condition: service_completed_successfully } }
  api:
    <<: *app
    environment:
      APP_PROFILE: laboratory
      AUTH_MODE: development
      LAB_ISOLATED: "true"
      APP_HOST: 0.0.0.0
      DATABASE_URL_FILE: /run/secrets/api_url
      DEV_TOKENS_FILE: /run/secrets/dev_tokens
      RPC_SOURCES_FILE: /lab/rpc-sources.json
    secrets: [api_url, dev_tokens]
    volumes: ["./rpc-sources.json:/lab/rpc-sources.json:ro"]
    networks: [database, web]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: { seed: { condition: service_completed_successfully } }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/live').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 30
  worker:
    <<: *app
    command: [node, --import, tsx, apps/worker/main.ts]
    environment: { DATABASE_URL_FILE: /run/secrets/worker_url, RPC_SOURCES_FILE: /lab/rpc-sources.json }
    secrets: [worker_url]
    volumes: ["./rpc-sources.json:/lab/rpc-sources.json:ro"]
    networks: [database, chain]
    depends_on: { seed: { condition: service_completed_successfully } }
  verifier:
    <<: *app
    profiles: [qualification]
    command: [node, --import, tsx, tests/integration/besu-probe.ts, before]
    environment:
      DATABASE_URL_FILE: /run/secrets/owner_url
      API_URL: http://api:3000
      DEV_TOKENS_FILE: /run/secrets/dev_tokens
      RPC_SOURCES_FILE: /lab/rpc-sources.json
    secrets: [owner_url, dev_tokens, witness_key]
    volumes:
      - ../../.runtime/lab/public.json:/lab/public.json:ro
      - ../../.runtime/lab/evidence:/evidence
      - ./rpc-sources.json:/lab/rpc-sources.json:ro
    networks: [chain, database]
    mem_limit: 512m
  volume-init:
    <<: *app
    user: "0:0"
    network_mode: none
    cap_add: [CHOWN, DAC_OVERRIDE]
    command: [node, scripts/init-volumes.mjs]
    secrets: [v1_key, v2_key, v3_key, v4_key, rpc_key, db_password, db_init]
    volumes:
      - postgres_files:/volumes/postgres
      - v1_data:/volumes/v1/data
      - v1_keys:/volumes/v1/keys
      - v2_data:/volumes/v2/data
      - v2_keys:/volumes/v2/keys
      - v3_data:/volumes/v3/data
      - v3_keys:/volumes/v3/keys
      - v4_data:/volumes/v4/data
      - v4_keys:/volumes/v4/keys
      - rpc_data:/volumes/rpc/data
      - rpc_keys:/volumes/rpc/keys
  v1:
    image: hyperledger/besu:26.9.0@sha256:fc1813d67d630d7660eea6ee555c01e73bfecda3e54d24f9484c1c4a52c6fcb0
    user: "1000:1000"
    entrypoint: [/opt/besu/bin/besu]
    command: ["--config-file=/config/besu.toml"]
    environment: { JAVA_OPTS: "-Xms128m -Xmx384m" }
    volumes:
      - v1_data:/data
      - v1_keys:/keys:ro
      - ../../.runtime/lab/instances/v1/config:/config:ro
